[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ackstreet-agent"
version = "0.1.0"
description = "A self-hosted, self-improving AI agent framework with tools, persistent memory and a skill registry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ACKSTREET AGENT contributors" }]
keywords = ["ai", "agent", "llm", "assistant", "automation", "self-hosted", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Utilities",
]

dependencies = [
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Adds a real YAML parser for skill frontmatter (a dependency-free fallback
# ships in ackstreet/skills/registry.py, so this is optional).
yaml = ["PyYAML>=6.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "build>=1.2",
  "PyYAML>=6.0",
]

[project.scripts]
ackstreet = "ackstreet.cli:main"

[project.urls]
Homepage = "https://github.com/ackstreet/ackstreet-agent"
Repository = "https://github.com/ackstreet/ackstreet-agent"
Issues = "https://github.com/ackstreet/ackstreet-agent/issues"

[tool.setuptools]
packages = [
  "ackstreet",
  "ackstreet.providers",
  "ackstreet.tools",
  "ackstreet.skills",
]

[tool.setuptools.package-data]
"ackstreet" = ["seeds/skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
